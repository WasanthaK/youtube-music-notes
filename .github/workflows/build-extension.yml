name: Build Chrome extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'extension/**'
      - '.github/workflows/build-extension.yml'
      - 'RUN_EXTENSION_VALIDATION'

concurrency:
  group: build-extension-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package.json

      - name: Install dependencies
        working-directory: extension
        run: npm install

      - name: Test tempo analyzer
        working-directory: extension
        run: node scripts/test-tempo-analysis.mjs

      - name: Test adaptive rhythm strokes
        working-directory: extension
        run: node scripts/test-rhythm-stroke-merge.mjs

      - name: Test guitar musical decoder
        working-directory: extension
        run: node scripts/test-guitar-musical-decoder.mjs

      - name: Apply v0.5.7 build patches
        working-directory: extension
        run: |
          set -euo pipefail
          node scripts/patch-soft-presence-v0412.mjs
          node scripts/patch-tempo-offscreen-v050.mjs
          node scripts/patch-tempo-engine-link-v050.mjs
          node scripts/patch-musical-decoder-v057.mjs
          node scripts/patch-musical-diagnostics-v057.mjs
          node scripts/patch-stable-phase2d-v053.mjs
          node scripts/patch-test-window-v054.mjs
          node scripts/patch-runtime-v057.mjs
          node scripts/patch-playback-volume-v055.mjs
          node scripts/patch-musical-playback-v056.mjs
          node scripts/patch-guitar-articulation-v057.mjs

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Validate v0.5.7 package inputs
        working-directory: extension
        run: node scripts/validate-v054.mjs

      - name: Prepare extension package
        run: |
          set -euo pipefail
          mkdir -p extension-package/dist
          cp extension/manifest.json extension-package/
          cp extension/offscreen.html extension-package/
          cp extension/popup.html extension-package/
          cp extension/popup.js extension-package/
          cp extension/popup.css extension-package/
          cp extension/result.html extension-package/
          cp extension/result.js extension-package/
          cp extension/result.css extension-package/
          cp extension/original-audio.js extension-package/
          cp extension/critic.js extension-package/
          cp extension/diagnostic-upload.js extension-package/
          cp extension/clean-playback.js extension-package/
          cp extension/service_worker.js extension-package/
          cp extension/service-worker-diagnostic.js extension-package/
          cp extension/dist/offscreen.bundle.js extension-package/dist/
          cp -R extension/dist/models extension-package/dist/models
          cp -R extension/dist/ort extension-package/dist/ort

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: youtube-music-notes-v0.5.7-musical-guitar-decoder
          path: extension-package/
          if-no-files-found: error
