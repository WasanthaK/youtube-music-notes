name: Guitar Ear remote research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/guitar-ear-research.yml'
  workflow_dispatch:
    inputs:
      dataset_mode:
        description: "Dataset mode: guitarset-baseline or existing-manifest"
        required: true
        default: "guitarset-baseline"
      manifest_path:
        description: "Manifest path under research/guitar_ear for existing-manifest mode"
        required: true
        default: "data/phase-2d.jsonl"
      epochs:
        description: "Training epochs"
        required: true
        default: "30"
      batch_size:
        description: "Training batch size"
        required: true
        default: "24"
      model_name:
        description: "Checkpoint name without extension"
        required: true
        default: "guitar-ear-research"

permissions:
  contents: read

env:
  DATASET_MODE: ${{ inputs.dataset_mode || 'guitarset-baseline' }}
  MANIFEST_PATH_INPUT: ${{ inputs.manifest_path || 'data/phase-2d.jsonl' }}
  EPOCHS_INPUT: ${{ inputs.epochs || '30' }}
  BATCH_SIZE_INPUT: ${{ inputs.batch_size || '24' }}
  MODEL_NAME_INPUT: ${{ inputs.model_name || 'guitar-ear-research' }}

jobs:
  research:
    name: Train and calibrate Guitar Ear
    runs-on: self-hosted
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Guarded Python 3.11 setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: research/guitar_ear/requirements.txt

      - name: Verify Python 3.11
        shell: bash
        run: |
          python --version
          python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version; print('Python 3.11 OK')"

      - name: Install requirements
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/guitar_ear/requirements.txt

      - name: Verify ffmpeg and CUDA
        shell: bash
        run: |
          ffmpeg -version | head -n 1
          python - <<'PY'
          import torch
          print('torch=', torch.__version__)
          print('cuda_available=', torch.cuda.is_available())
          if not torch.cuda.is_available():
              raise SystemExit('CUDA is required but is not available on this runner')
          print('cuda_device=', torch.cuda.get_device_name(0))
          PY

      - name: Select manifest
        id: manifest
        shell: bash
        working-directory: research/guitar_ear
        run: |
          set -euo pipefail
          MODE="$DATASET_MODE"
          if [ "$MODE" = "guitarset-baseline" ]; then
            python download_guitarset.py --dest data/GuitarSet
            python prepare_guitarset.py \
              --annotations data/GuitarSet/annotation \
              --audio data/GuitarSet/audio_mono-mic \
              --out data/guitarset.jsonl
            echo "path=data/guitarset.jsonl" >> "$GITHUB_OUTPUT"
          elif [ "$MODE" = "existing-manifest" ]; then
            MANIFEST="$MANIFEST_PATH_INPUT"
            test -f "$MANIFEST"
            echo "path=$MANIFEST" >> "$GITHUB_OUTPUT"
          else
            echo "Unknown dataset_mode: $MODE" >&2
            exit 2
          fi

      - name: Train Guitar Ear
        shell: bash
        working-directory: research/guitar_ear
        run: |
          python train.py \
            --manifest "${{ steps.manifest.outputs.path }}" \
            --epochs "$EPOCHS_INPUT" \
            --batch-size "$BATCH_SIZE_INPUT" \
            --out "checkpoints/$MODEL_NAME_INPUT.pt"

      - name: Calibrate validation thresholds
        shell: bash
        working-directory: research/guitar_ear
        run: |
          python calibrate.py \
            --checkpoint "checkpoints/$MODEL_NAME_INPUT.pt" \
            --manifest "${{ steps.manifest.outputs.path }}" \
            --split val \
            --presence-min-precision 0.90 \
            --attack-tolerance-ms 50 \
            --model-name "$MODEL_NAME_INPUT" \
            --out "checkpoints/$MODEL_NAME_INPUT-calibration.json"

      - name: Record run metadata
        shell: bash
        working-directory: research/guitar_ear
        env:
          MANIFEST_PATH: ${{ steps.manifest.outputs.path }}
          RUN_ID: ${{ github.run_id }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json, os, pathlib, torch, sys
          result = {
              'dataset_mode': os.environ['DATASET_MODE'],
              'manifest_path': os.environ['MANIFEST_PATH'],
              'epochs': int(os.environ['EPOCHS_INPUT']),
              'batch_size': int(os.environ['BATCH_SIZE_INPUT']),
              'model_name': os.environ['MODEL_NAME_INPUT'],
              'github_run_id': os.environ['RUN_ID'],
              'git_sha': os.environ['GIT_SHA'],
              'python': sys.version,
              'torch': torch.__version__,
              'cuda_available': torch.cuda.is_available(),
              'cuda_device': torch.cuda.get_device_name(0) if torch.cuda.is_available() else None,
          }
          pathlib.Path('checkpoints').mkdir(exist_ok=True)
          pathlib.Path('checkpoints/run-metadata.json').write_text(json.dumps(result, indent=2), encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitar-ear-research-${{ github.run_id }}
          path: |
            research/guitar_ear/checkpoints/*.pt
            research/guitar_ear/checkpoints/*-calibration.json
            research/guitar_ear/checkpoints/run-metadata.json
            research/guitar_ear/data/*.jsonl
          if-no-files-found: warn
          retention-days: 30
