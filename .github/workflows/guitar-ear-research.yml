name: Guitar Ear remote research

on:
  workflow_dispatch:
    inputs:
      dataset_mode:
        description: Dataset source for this run
        required: true
        default: guitarset-baseline
        type: choice
        options:
          - guitarset-baseline
          - existing-manifest
      manifest_path:
        description: Manifest path under research/guitar_ear when using existing-manifest
        required: true
        default: data/phase-2d.jsonl
        type: string
      epochs:
        description: Training epochs
        required: true
        default: '30'
        type: string
      batch_size:
        description: Training batch size
        required: true
        default: '24'
        type: string
      model_name:
        description: Output model/checkpoint name without extension
        required: true
        default: guitar-ear-research
        type: string
      require_cuda:
        description: Fail immediately if CUDA is unavailable on the self-hosted runner
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  research:
    name: Train and calibrate Guitar Ear
    runs-on: self-hosted
    timeout-minutes: 720

    steps:
      - name: Checkout repository without deleting runner-local research data
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research/guitar_ear/requirements.txt

      - name: Install Python requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r research/guitar_ear/requirements.txt

      - name: Verify ffmpeg and PyTorch
        run: |
          ffmpeg -version
          python -c "import torch; print('torch=', torch.__version__); print('cuda_available=', torch.cuda.is_available()); print('cuda_device=', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'none')"

      - name: Require CUDA
        if: ${{ inputs.require_cuda }}
        run: python -c "import torch; assert torch.cuda.is_available(), 'CUDA is required for this run but is not available'; print('CUDA OK:', torch.cuda.get_device_name(0))"

      - name: Download GuitarSet
        if: ${{ inputs.dataset_mode == 'guitarset-baseline' }}
        working-directory: research/guitar_ear
        run: python download_guitarset.py --dest data/GuitarSet

      - name: Prepare GuitarSet manifest
        if: ${{ inputs.dataset_mode == 'guitarset-baseline' }}
        working-directory: research/guitar_ear
        run: python prepare_guitarset.py --annotations data/GuitarSet/annotation --audio data/GuitarSet/audio_mono-mic --out data/guitarset.jsonl

      - name: Verify supplied manifest
        if: ${{ inputs.dataset_mode == 'existing-manifest' }}
        working-directory: research/guitar_ear
        run: python -c "from pathlib import Path; p=Path(r'${{ inputs.manifest_path }}'); assert p.is_file(), f'Manifest not found: {p.resolve()}'; print('using manifest:', p.resolve())"

      - name: Train Guitar Ear on GuitarSet baseline
        if: ${{ inputs.dataset_mode == 'guitarset-baseline' }}
        working-directory: research/guitar_ear
        run: python train.py --manifest data/guitarset.jsonl --epochs ${{ inputs.epochs }} --batch-size ${{ inputs.batch_size }} --out checkpoints/${{ inputs.model_name }}.pt

      - name: Train Guitar Ear on supplied manifest
        if: ${{ inputs.dataset_mode == 'existing-manifest' }}
        working-directory: research/guitar_ear
        run: python train.py --manifest "${{ inputs.manifest_path }}" --epochs ${{ inputs.epochs }} --batch-size ${{ inputs.batch_size }} --out checkpoints/${{ inputs.model_name }}.pt

      - name: Calibrate validation thresholds on GuitarSet baseline
        if: ${{ inputs.dataset_mode == 'guitarset-baseline' }}
        working-directory: research/guitar_ear
        run: python calibrate.py --checkpoint checkpoints/${{ inputs.model_name }}.pt --manifest data/guitarset.jsonl --split val --presence-min-precision 0.90 --attack-tolerance-ms 50 --model-name ${{ inputs.model_name }} --out checkpoints/${{ inputs.model_name }}-calibration.json

      - name: Calibrate validation thresholds on supplied manifest
        if: ${{ inputs.dataset_mode == 'existing-manifest' }}
        working-directory: research/guitar_ear
        run: python calibrate.py --checkpoint checkpoints/${{ inputs.model_name }}.pt --manifest "${{ inputs.manifest_path }}" --split val --presence-min-precision 0.90 --attack-tolerance-ms 50 --model-name ${{ inputs.model_name }} --out checkpoints/${{ inputs.model_name }}-calibration.json

      - name: Write run metadata
        working-directory: research/guitar_ear
        env:
          DATASET_MODE: ${{ inputs.dataset_mode }}
          MANIFEST_PATH: ${{ inputs.manifest_path }}
          EPOCHS: ${{ inputs.epochs }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MODEL_NAME: ${{ inputs.model_name }}
          GITHUB_SHA_VALUE: ${{ github.sha }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: python -c "import json, os, pathlib, torch; d={'dataset_mode':os.environ['DATASET_MODE'],'manifest_path':os.environ['MANIFEST_PATH'],'epochs':int(os.environ['EPOCHS']),'batch_size':int(os.environ['BATCH_SIZE']),'model_name':os.environ['MODEL_NAME'],'git_sha':os.environ['GITHUB_SHA_VALUE'],'github_run_id':os.environ['GITHUB_RUN_ID_VALUE'],'torch':torch.__version__,'cuda_available':torch.cuda.is_available(),'cuda_device':torch.cuda.get_device_name(0) if torch.cuda.is_available() else None}; pathlib.Path('checkpoints').mkdir(exist_ok=True); pathlib.Path('checkpoints/run-metadata.json').write_text(json.dumps(d, indent=2), encoding='utf-8'); print(json.dumps(d, indent=2))"

      - name: Upload research outputs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: guitar-ear-${{ inputs.model_name }}-${{ github.run_id }}
          path: |
            research/guitar_ear/checkpoints/${{ inputs.model_name }}.pt
            research/guitar_ear/checkpoints/${{ inputs.model_name }}-calibration.json
            research/guitar_ear/checkpoints/run-metadata.json
            research/guitar_ear/data/*.jsonl
          if-no-files-found: warn
          retention-days: 30
