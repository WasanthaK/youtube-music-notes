name: Patch Browser Diagnostics

on:
  push:
    paths:
      - '.github/workflows/patch-browser-diagnostics.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: browser-phase2d-onnx

      - name: Patch automatic diagnostic payload
        shell: python
        run: |
          from pathlib import Path

          path = Path('extension/src/offscreen-phase2d.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace("source: 'chrome-extension',", "source: 'chrome-extension-browser',")
          text = text.replace("        Authorization: `Bearer ${SUPABASE_PUBLISHABLE_KEY}`,\n", "")

          old = """      ...(guitarEar?.available ? {} : { guitarEar: guitarEar || { available: false } }),"""
          new = """      ...(guitarEar?.available ? {\n        guitarEar: {\n          ...result.summary.guitarEar,\n          inferenceMode: guitarEar.inferenceMode || null,\n          windowStrideSeconds: guitarEar.windowStrideSeconds ?? null,\n          activeSegmentFraction: guitarEar.activeSegmentFraction ?? null,\n          segmentScores: guitarEar.segmentScores || [],\n        },\n      } : { guitarEar: guitarEar || { available: false } }),"""
          if old not in text:
              raise SystemExit('summary guitarEar patch target not found')
          text = text.replace(old, new)

          old = """    active_intervals: guitarEar.activeIntervals || [],\n    gate"""
          new = """    active_intervals: guitarEar.activeIntervals || [],\n    inference_mode: guitarEar.inferenceMode ?? null,\n    window_stride_seconds: guitarEar.windowStrideSeconds ?? null,\n    active_segment_fraction: guitarEar.activeSegmentFraction ?? null,\n    segment_scores: guitarEar.segmentScores || [],\n    gate"""
          if old not in text:
              raise SystemExit('compact guitarEar patch target not found')
          text = text.replace(old, new)

          old = """      guitar_ear: compactGuitarEar(s)\n    }"""
          new = """      guitar_ear: compactGuitarEar(s),\n      note_trace: (result.notes || []).map(note => ({\n        start: Number(note.start || 0),\n        end: Number(note.end || note.start || 0),\n        midi: Number(note.midi),\n        confidence: Number(note.confidence || 0),\n        chord_id: Number.isFinite(Number(note.chordId)) ? Number(note.chordId) : null,\n        support: note.guitarEarSupport || null,\n        string: note.guitar?.string ?? null,\n        fret: note.guitar?.fret ?? null\n      }))\n    }"""
          if old not in text:
              raise SystemExit('note trace patch target not found')
          text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/src/offscreen-phase2d.js
          git commit -m "Automate rich browser diagnostic upload"
          git push origin HEAD:browser-phase2d-onnx
