name: Release Chrome extension

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: build and upload the zip as a workflow artifact only, do not create or update a GitHub release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package.json

      - name: Install dependencies
        working-directory: extension
        run: npm install

      - name: Check version consistency
        working-directory: extension
        run: node scripts/check-version.mjs

      - name: Test tempo analyzer
        working-directory: extension
        run: node scripts/test-tempo-analysis.mjs

      - name: Test adaptive rhythm strokes
        working-directory: extension
        run: node scripts/test-rhythm-stroke-merge.mjs

      - name: Test guitar musical decoder
        working-directory: extension
        run: node scripts/test-guitar-musical-decoder.mjs

      - name: Test pipeline purity
        working-directory: extension
        run: node scripts/test-pipeline-purity.mjs

      - name: Test popup progress
        working-directory: extension
        run: node scripts/test-popup-progress.mjs

      - name: Test TAB layout
        working-directory: extension
        run: node scripts/test-tab-layout.mjs

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Verify model files
        working-directory: extension
        run: node scripts/verify-models.mjs

      - name: Test Node transcription CLI
        working-directory: extension
        timeout-minutes: 15
        run: node scripts/test-node-transcribe.mjs

      - name: Validate v0.5.7 package inputs
        working-directory: extension
        run: node scripts/validate-v054.mjs

      - name: Prepare extension package
        run: bash extension/scripts/package-extension.sh extension-package

      - name: Create release zip
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          (cd extension-package && zip -r "../youtube-music-notes-v$VERSION.zip" .)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-music-notes-v${{ env.VERSION }}
          path: youtube-music-notes-v${{ env.VERSION }}.zip
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          ZIP="youtube-music-notes-v$VERSION.zip"
          NOTES="RELEASE_NOTES_v$VERSION.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            NOTES_ARGS=(--generate-notes)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
            if [ -f "$NOTES" ]; then
              gh release edit "$TAG" --notes-file "$NOTES"
            fi
          else
            gh release create "$TAG" "$ZIP" \
              --target "$GITHUB_SHA" \
              --title "YouTube Music Notes $TAG" \
              "${NOTES_ARGS[@]}"
          fi
