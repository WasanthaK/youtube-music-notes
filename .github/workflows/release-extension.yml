name: Release Chrome extension

on:
  workflow_dispatch:
  push:
    paths:
      - 'RELEASE_V0_4_6'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package.json

      - name: Install dependencies
        working-directory: extension
        run: npm install

      - name: Build browser transcription bundle
        working-directory: extension
        run: npm run build

      - name: Prepare release package
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./extension/manifest.json').version")
          test "$VERSION" = "0.4.6"
          mkdir -p extension-package/dist
          cp extension/manifest.json extension-package/
          cp extension/offscreen.html extension-package/
          cp extension/popup.html extension-package/
          cp extension/popup.js extension-package/
          cp extension/popup.css extension-package/
          cp extension/result.html extension-package/
          cp extension/result.js extension-package/
          cp extension/result.css extension-package/
          cp extension/original-audio.js extension-package/
          cp extension/critic.js extension-package/
          cp extension/service_worker.js extension-package/
          cp extension/dist/offscreen.bundle.js extension-package/dist/
          node -e "const m=JSON.parse(require('fs').readFileSync('extension-package/manifest.json','utf8')); if(m.version!=='0.4.6') process.exit(1); console.log('manifest version',m.version)"
          node --check extension-package/original-audio.js
          node --check extension-package/result.js
          (cd extension-package && zip -r ../youtube-music-notes-v0.4.6.zip .)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.6 >/dev/null 2>&1; then
            gh release upload v0.4.6 youtube-music-notes-v0.4.6.zip --clobber
          else
            gh release create v0.4.6 youtube-music-notes-v0.4.6.zip \
              --target "$GITHUB_SHA" \
              --title "YouTube Music Notes v0.4.6" \
              --notes-file RELEASE_NOTES_v0.4.6.md
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-music-notes-v0.4.6
          path: youtube-music-notes-v0.4.6.zip
          if-no-files-found: error
          retention-days: 90
