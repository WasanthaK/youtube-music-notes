<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Music Notes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>YouTube Music Notes</h1>
    <p class="sub">Transcribes the first 90 seconds of the YouTube video in this tab into guitar TAB.</p>

    <label>Instrument
      <select id="instrument">
        <option value="guitar">Guitar</option>
        <option value="flute">Flute</option>
      </select>
    </label>

    <label>Mode
      <select id="mode">
        <option value="arrange">Arrange melody for instrument</option>
        <option value="transcribe">Transcribe recorded part</option>
      </select>
    </label>

    <label>
      <input type="checkbox" id="shareDiagnostics" />
      Share anonymous diagnostics
    </label>
    <p class="hint">Sends the video ID, detected notes and metrics to help improve accuracy. Off by default.</p>

    <div class="status"><strong>Section:</strong> 0:00 → 1:30 (the video restarts from the beginning)</div>

    <div class="buttons">
      <button id="start">Transcribe first 90 seconds</button>
      <button id="stop" class="secondary">Stop</button>
    </div>

    <div id="status">Ready.</div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
