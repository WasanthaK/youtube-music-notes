<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Music Notes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>YouTube Music Notes</h1>
    <p class="sub">Benchmark the same 30-second section of any YouTube video automatically.</p>

    <label>Instrument
      <select id="instrument">
        <option value="guitar">Guitar</option>
        <option value="flute">Flute</option>
      </select>
    </label>

    <label>Mode
      <select id="mode">
        <option value="arrange">Arrange melody for instrument</option>
        <option value="transcribe">Transcribe recorded part</option>
      </select>
    </label>

    <div class="status"><strong>Benchmark sample:</strong> 0:30 → 1:00 automatically</div>

    <div class="buttons">
      <button id="start">Run 30-second benchmark</button>
      <button id="stop" class="secondary">Stop</button>
    </div>

    <div id="status">Ready.</div>
    <p class="hint">Each result can be compared by YouTube video ID, 30–60s segment, engine version, and metrics. Later we can add random samples automatically.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
