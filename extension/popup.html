<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube Music Notes</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <main>
    <h1>YouTube Music Notes</h1>
    <p class="sub">Choose an exact YouTube passage, then turn it into a playable chart.</p>

    <label>Instrument
      <select id="instrument">
        <option value="guitar">Guitar</option>
        <option value="flute">Flute</option>
      </select>
    </label>

    <label>Mode
      <select id="mode">
        <option value="arrange">Arrange melody for instrument</option>
        <option value="transcribe">Transcribe recorded part</option>
      </select>
    </label>

    <div class="segment-grid">
      <label>Start
        <input id="startTime" value="0:00" placeholder="0:00" />
      </label>
      <label>End
        <input id="endTime" value="1:00" placeholder="1:00" />
      </label>
    </div>

    <div class="buttons">
      <button id="start">Analyse exact segment</button>
      <button id="stop" class="secondary">Stop</button>
    </div>

    <div id="status">Ready.</div>
    <p class="hint">Use the same YouTube video + start/end times for repeatable benchmarks.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
